name: Fast API build (amd64)

on:
  push:
    branches: ["fastbuild/**"]

permissions:
  contents: read
  packages: write

jobs:
  api-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/manan-santoki/firecrawl-community:community-v2.11.739.2-amd64
          build-args: |
            GIT_SHA=9e143cf43c386b711e5c0b405b58f26318d7a1af
          cache-from: type=gha,scope=api
      - run: echo "DIGEST ${{ steps.build.outputs.digest }}"

name: Fast build release-3 (amd64)

on:
  push:
    branches: ["fastbuild/release-3"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: apps/api, image: firecrawl-community, scope: api }
          - { context: community/migrations, image: firecrawl-migrations-community, scope: migrations }
          - { context: apps/dashboard-community, image: firecrawl-dashboard-community, scope: dashboard }
          - { context: apps/fire-engine-community, image: firecrawl-fire-engine-community, scope: fire-engine }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/manan-santoki/${{ matrix.image }}:release-3-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.scope }}
      - run: echo "DIGEST ${{ matrix.scope }} ${{ steps.build.outputs.digest }}"

name: Community container release

on:
  push:
    tags: ["community-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Immutable community release tag to build
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: community-container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Manan-Santoki/firecrawl'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: apps/api
            image: firecrawl-community
          - component: playwright
            context: apps/playwright-service-ts
            image: firecrawl-playwright-community
          - component: nuq-postgres
            context: apps/nuq-postgres
            image: firecrawl-nuq-postgres-community
          - component: browser
            context: apps/browser-service-community
            image: firecrawl-browser-community
          - component: migrations
            context: community/migrations
            image: firecrawl-migrations-community
    steps:
      - name: Resolve immutable release
        id: release
        env:
          DISPATCH_RELEASE: ${{ inputs.release }}
        run: |
          release="${DISPATCH_RELEASE:-${GITHUB_REF_NAME}}"
          if [[ ! "${release}" =~ ^community-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid community release tag: ${release}"
            exit 1
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.release }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release is an immutable tag on main
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        shell: bash
        run: |
          git show-ref --verify --quiet "refs/tags/${RELEASE}" || {
            echo "Release input does not name an exact tag: ${RELEASE}"
            exit 1
          }
          tag_commit="$(git rev-parse "refs/tags/${RELEASE}^{commit}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          git fetch origin --force main:refs/remotes/origin/main
          git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main || {
            echo "Release tag ${RELEASE} is not reachable from main"
            exit 1
          }
      - name: Resolve source commit
        id: source
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${source_sha:0:7}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manan-santoki/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.release }}
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Attest immutable image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/manan-santoki/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: Community automatic release tag

on:
  workflow_run:
    workflows: ["Community CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: community-auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.repository == 'Manan-Santoki/firecrawl' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify this is still the tested main commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${TESTED_SHA}"
          test "$(git rev-parse origin/main)" = "${TESTED_SHA}"
      - name: Determine whether runtime images changed
        id: impact
        run: |
          git fetch origin --tags --force
          previous="$(git tag --merged HEAD --list 'community-v*' --sort=-version:refname | head -n 1)"
          if [[ -z "${previous}" ]]; then
            release_required=true
            echo "No prior community release tag is reachable; an initial release is required."
          else
            mapfile -t changed_paths < <(git diff --name-only "${previous}^{commit}" HEAD)
            release_required="$(node community/scripts/release-impact.mjs "${changed_paths[@]}")"
            printf 'Compared %s with %s. Changed paths:\n' "${previous}" "$(git rev-parse HEAD)"
            printf '  %s\n' "${changed_paths[@]}"
          fi
          echo "release_required=${release_required}" >> "${GITHUB_OUTPUT}"
          echo "Runtime image release required: ${release_required}"
      - name: Create the next immutable community release tag
        id: release
        if: steps.impact.outputs.release_required == 'true'
        run: |
          git fetch origin --tags --force
          git remote add canonical https://github.com/firecrawl/firecrawl.git
          git fetch canonical --force --prune 'refs/tags/v*:refs/tags/canonical/v*'
          release="$(git tag --points-at HEAD --list 'community-v*' --sort=-version:refname | head -n 1)"
          if [[ -z "${release}" ]]; then
            upstream=""
            while IFS= read -r candidate_ref; do
              if git merge-base --is-ancestor "${candidate_ref}^{commit}" HEAD; then
                upstream="${candidate_ref##*/}"
                break
              fi
            done < <(git for-each-ref --sort=-version:refname --format='%(refname)' \
              'refs/tags/canonical/v*' | grep -E '/v[0-9]+\.[0-9]+\.[0-9]+$')
            if [[ -z "${upstream}" ]]; then
              echo "No semantic upstream release tag is reachable from main."
              exit 1
            fi
            previous="$(git tag --list "community-${upstream}.*" --sort=-version:refname | head -n 1)"
            if [[ -z "${previous}" ]]; then
              revision=1
            else
              revision="$(( ${previous##*.} + 1 ))"
            fi
            release="community-${upstream}.${revision}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${release}" -m "${release}"
            git push origin "${release}"
          else
            echo "Reusing existing release tag ${release}."
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
      - name: Dispatch the container build explicitly
        if: steps.impact.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run community-release.yml
          --ref ${{ steps.release.outputs.release }}
          --field release=${{ steps.release.outputs.release }}
      - name: Record documentation-only completion
        if: steps.impact.outputs.release_required != 'true'
        run: echo "No runtime image inputs changed; retaining the current immutable community release."

name: Community automatic release tag

on:
  workflow_run:
    workflows: ["Community CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.repository == 'Manan-Santoki/firecrawl' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Create the next immutable community release tag
        run: |
          git fetch origin --tags --force
          if git tag --points-at HEAD --list 'community-v*' | grep -q .; then
            echo "This commit already has a community release tag."
            exit 0
          fi
          upstream="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ -z "${upstream}" ]]; then
            echo "No semantic upstream release tag is reachable from main."
            exit 1
          fi
          previous="$(git tag --list "community-${upstream}.*" --sort=-version:refname | head -n 1)"
          if [[ -z "${previous}" ]]; then
            revision=1
          else
            revision="$(( ${previous##*.} + 1 ))"
          fi
          release="community-${upstream}.${revision}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${release}" -m "${release}"
          git push origin "${release}"

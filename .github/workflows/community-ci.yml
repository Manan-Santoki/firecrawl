        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.avgrab.yaml config --quiet
          resolved_context="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.avgrab.yaml config --format json | jq -r '.services["avgrab-community"].build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath .)"
          test "$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.avgrab.yaml config --format json | jq -r '.services.api.environment.AVGRAB_SERVICE_URL')" = "http://avgrab-community:8080/k/ci-avgrab-key"
      - name: Build image and run black-box contract tests against the container
        # Offline only: media comes from a local ffmpeg fixture server on a
        # private Docker network. Live provider tests stay opt-in.
        run: PYTHON=python scripts/contract.sh

  fire-engine:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.fireengine == 'true'

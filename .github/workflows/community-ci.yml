name: Community CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      api: ${{ steps.filter.outputs.api }}
      database: ${{ steps.filter.outputs.database }}
      index: ${{ steps.filter.outputs.index }}
      browser: ${{ steps.filter.outputs.browser }}
      highlight: ${{ steps.filter.outputs.highlight }}
      privacy: ${{ steps.filter.outputs.privacy }}
      avgrab: ${{ steps.filter.outputs.avgrab }}
      fireengine: ${{ steps.filter.outputs.fireengine }}
      agent: ${{ steps.filter.outputs.agent }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            contract:
              - "community/**"
              - "docker-compose.yaml"
              - ".github/workflows/community-ci.yml"
            api:
              - "apps/api/**"
              - ".github/workflows/community-ci.yml"
            database:
              - "community/migrations/**"
              - "community/scripts/migrate*"
              - "apps/api/src/db/schema/**"
              - ".github/workflows/community-ci.yml"
            index:
              - "community/migrations/**"
              - "community/index-storage/**"
              - "community/tests/index-e2e/**"
              - "community/docker-compose.index.yaml"
              - "community/docker-compose.highlight.yaml"
              - "community/docker-compose.auth.yaml"
              - "docker-compose.yaml"
              - "apps/api/**"
              - "apps/highlight-service-community/**"
              - ".github/workflows/community-ci.yml"
            browser:
              - "apps/browser-service-community/**"
              - "community/docker-compose.browser.yaml"
              - ".github/workflows/community-ci.yml"
            highlight:
              - "apps/highlight-service-community/**"
              - "community/docker-compose.highlight.yaml"
              - ".github/workflows/community-ci.yml"
            privacy:
              - "apps/fire-privacy-community/**"
              - "community/docker-compose.privacy.yaml"
              - ".github/workflows/community-ci.yml"
            avgrab:
              - "apps/avgrab-community/**"
              - "community/docker-compose.avgrab.yaml"
              - ".github/workflows/community-ci.yml"
            fireengine:
              - "apps/fire-engine-community/**"
              - "community/docker-compose.fire-engine.yaml"
              - ".github/workflows/community-ci.yml"
            agent:
              - "apps/agent-community/**"
              - "community/docker-compose.agent.yaml"
              - ".github/workflows/community-ci.yml"
            dashboard:
              - "apps/dashboard-community/**"
              - "community/docker-compose.dashboard.yaml"
              - "community/migrations/**"
              - "community/capabilities.yml"
              - ".github/workflows/community-ci.yml"

  community-contract:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test capability manifest and release tooling
        run: node --test community/scripts/render-capabilities.test.mjs community/scripts/compare-openapi.test.mjs community/scripts/release-impact.test.mjs community/scripts/select-upstream-release.test.mjs community/scripts/should-dispatch-ci.test.mjs community/scripts/upstream-state.test.mjs
      - name: Test migration tooling
        run: node --test community/scripts/migrate.test.mjs
      - name: Test index storage gateway
        run: node --test community/scripts/gcs-json-gateway.test.mjs
      - name: Verify generated feature matrix
        run: node community/scripts/render-capabilities.mjs --check
      - name: Validate root Compose model
        run: docker compose -f docker-compose.yaml config --quiet
      - name: Validate authenticated browser Compose model
        env:
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          BROWSER_SERVICE_API_KEY: ci-browser-key
        run: |
          docker compose -f docker-compose.yaml -f community/docker-compose.auth.yaml -f community/docker-compose.browser.yaml config --quiet
          resolved_context="$(docker compose -f docker-compose.yaml -f community/docker-compose.auth.yaml -f community/docker-compose.browser.yaml config --format json | jq -r '.services["browser-service-community"].build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath apps/browser-service-community)"
      - name: Build browser service through the combined community stack
        env:
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          BROWSER_SERVICE_API_KEY: ci-browser-key
        run: docker compose -f docker-compose.yaml -f community/docker-compose.auth.yaml -f community/docker-compose.browser.yaml build browser-service-community
      - name: Stress concurrent browser lifecycle in the built image
        env:
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          BROWSER_SERVICE_API_KEY: ci-browser-key
        run: |
          image_id="$(docker image inspect firecrawl-browser-service-community --format '{{.Id}}')"
          test -n "${image_id}"
          docker run --detach --name browser-community-stress --init --pids-limit 512 \
            --publish 127.0.0.1:39006:3006 \
            --env BROWSER_SERVICE_API_KEY=ci-browser-key \
            --env MAX_CONCURRENT_SESSIONS=2 \
            "${image_id}"
          trap 'docker logs browser-community-stress || true; docker rm --force browser-community-stress >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:39006/health/liveness >/dev/null; then break; fi
            if [ "${attempt}" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          BROWSER_STRESS_API_KEY=ci-browser-key node apps/browser-service-community/test/stress.mjs
          test "$(docker inspect --format '{{.State.Running}}' browser-community-stress)" = true
          test "$(docker exec browser-community-stress ps -e -o stat= | grep -c '^Z' || true)" = 0

  api-build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      # The production Dockerfile installs the pinned FoundationDB client and
      # builds the local napi-rs package. Testing that path avoids a misleading
      # host build with missing native headers.
      - name: Build production API image
        run: docker build --build-arg "GIT_SHA=${GITHUB_SHA}" --tag firecrawl-community-ci .

  database-contract:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firecrawl
        options: >-
          --health-cmd "pg_isready -U postgres -d firecrawl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply versioned portable database migrations
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d firecrawl "$@"\n' "${POSTGRES_ID}" > /tmp/firecrawl-psql
          chmod +x /tmp/firecrawl-psql
          PSQL_BINARY=/tmp/firecrawl-psql PGUSER=postgres PGDATABASE=firecrawl \
            node community/migrations/migrate.mjs apply
          docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d firecrawl \
            -v org_id=11111111-1111-4111-8111-111111111111 \
            -v team_id=22222222-2222-4222-8222-222222222222 \
            -v api_key=33333333-3333-4333-8333-333333333333 \
            < community/migrations/postgres/090-seed.sql
      - name: Verify migration status and idempotency
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          PSQL_BINARY=/tmp/firecrawl-psql PGUSER=postgres PGDATABASE=firecrawl \
            node community/migrations/migrate.mjs apply
          PSQL_BINARY=/tmp/firecrawl-psql PGUSER=postgres PGDATABASE=firecrawl \
            node community/migrations/migrate.mjs status | tee /tmp/migration-status.json
          grep -q '"state": "applied"' /tmp/migration-status.json
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d firecrawl -Atc 'SELECT count(*) FROM public.schema_migrations')" = 10
          docker exec "${POSTGRES_ID}" psql -U postgres -d firecrawl -v ON_ERROR_STOP=1 -c \
            "UPDATE public.schema_migrations SET checksum_sha256 = repeat('0', 64) WHERE version = '010-prerequisites'"
          if PSQL_BINARY=/tmp/firecrawl-psql PGUSER=postgres PGDATABASE=firecrawl \
            node community/migrations/migrate.mjs status; then
            echo "status unexpectedly accepted checksum drift" >&2
            exit 1
          fi
          docker exec "${POSTGRES_ID}" psql -U postgres -d firecrawl -v ON_ERROR_STOP=1 -c \
            "UPDATE public.schema_migrations SET checksum_sha256 = '4b66a0c693db30e96947ad6b27f968c4585db23afe90461b03f62e88daa6c884' WHERE version = '010-prerequisites'"
      - name: Verify authenticated and browser schema
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d firecrawl -Atc \
            "SELECT CASE WHEN to_regclass('public.agent_session_settings') IS NOT NULL THEN 'ok' ELSE 'missing' END" | grep -qx ok
          docker exec "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d firecrawl -Atc \
            "SELECT team_id FROM public.auth_chunk_1('33333333-3333-4333-8333-333333333333')" | grep -qx 22222222-2222-4222-8222-222222222222
          docker exec "${POSTGRES_ID}" psql -q -v ON_ERROR_STOP=1 -U postgres -d firecrawl -c "CREATE ROLE untrusted"
          docker exec "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d firecrawl -Atc \
            "SELECT has_function_privilege('untrusted', 'public.auth_chunk_1_from_team(text)', 'EXECUTE')" | grep -qx f
      - name: Verify explicit legacy adoption and divergent-schema refusal
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          docker exec "${POSTGRES_ID}" createdb -U postgres legacy
          for migration in \
            010-prerequisites.sql \
            020-current-schema.sql \
            030-selfhost-constraints.sql \
            040-selfhost-rpcs.sql; do
            docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d legacy \
              < "community/migrations/postgres/${migration}"
          done
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d legacy "$@"\n' \
            "${POSTGRES_ID}" > /tmp/firecrawl-psql-legacy
          chmod +x /tmp/firecrawl-psql-legacy
          if PSQL_BINARY=/tmp/firecrawl-psql-legacy PGUSER=postgres PGDATABASE=legacy \
            node community/migrations/migrate.mjs adopt --baseline-through 040-selfhost-rpcs; then
            echo "legacy adoption unexpectedly proceeded without confirmation" >&2
            exit 1
          fi
          PSQL_BINARY=/tmp/firecrawl-psql-legacy PGUSER=postgres PGDATABASE=legacy \
            node community/migrations/migrate.mjs adopt \
              --confirm-existing --baseline-through 040-selfhost-rpcs
          PSQL_BINARY=/tmp/firecrawl-psql-legacy PGUSER=postgres PGDATABASE=legacy \
            node community/migrations/migrate.mjs adopt \
              --confirm-existing --baseline-through 040-selfhost-rpcs
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d legacy -Atc \
            "SELECT count(*) || ':' || count(*) FILTER (WHERE baselined) || ':' || count(*) FILTER (WHERE version = '050-revoke-public-rpc-execute' AND NOT baselined) FROM public.schema_migrations")" = "10:4:1"

          docker exec "${POSTGRES_ID}" createdb -U postgres divergent
          for migration in \
            010-prerequisites.sql \
            020-current-schema.sql \
            030-selfhost-constraints.sql \
            040-selfhost-rpcs.sql; do
            docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d divergent \
              < "community/migrations/postgres/${migration}"
          done
          docker exec "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d divergent -c \
            "DROP FUNCTION public.monitoring_claim_due_monitors(text, integer, integer)"
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d divergent "$@"\n' \
            "${POSTGRES_ID}" > /tmp/firecrawl-psql-divergent
          chmod +x /tmp/firecrawl-psql-divergent
          if PSQL_BINARY=/tmp/firecrawl-psql-divergent PGUSER=postgres PGDATABASE=divergent \
            node community/migrations/migrate.mjs adopt \
              --confirm-existing --baseline-through 040-selfhost-rpcs; then
            echo "divergent schema unexpectedly passed adoption checks" >&2
            exit 1
          fi
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d divergent -Atc \
            "SELECT to_regclass('public.schema_migrations') IS NULL")" = "t"

  index-database-contract:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firecrawl_index
        options: >-
          --health-cmd "pg_isready -U postgres -d firecrawl_index"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply index migrations twice and verify status
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d firecrawl_index "$@"\n' "${POSTGRES_ID}" > /tmp/index-psql
          chmod +x /tmp/index-psql
          for run in 1 2; do
            PSQL_BINARY=/tmp/index-psql PGUSER=postgres PGDATABASE=firecrawl_index \
              node community/migrations/migrate.mjs apply --manifest community/migrations/index-db/manifest.json
          done
          PSQL_BINARY=/tmp/index-psql PGUSER=postgres PGDATABASE=firecrawl_index \
            node community/migrations/migrate.mjs status --manifest community/migrations/index-db/manifest.json | tee /tmp/index-status.json
          test "$(grep -c '"state": "applied"' /tmp/index-status.json)" = 3
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d firecrawl_index -Atc 'SELECT count(*) FROM public.index_schema_migrations')" = 3
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d firecrawl_index -Atc "SELECT to_regclass('public.schema_migrations') IS NULL")" = t
      - name: Run index function behaviour tests
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d firecrawl_index \
            < community/scripts/index-db-functions.test.sql | tee /tmp/index-functions.log
          grep -q 'index-db function tests passed' /tmp/index-functions.log
      - name: Share one database with the application manifest
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_ID}" createdb -U postgres shared
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d shared "$@"\n' "${POSTGRES_ID}" > /tmp/shared-psql
          chmod +x /tmp/shared-psql
          PSQL_BINARY=/tmp/shared-psql PGUSER=postgres PGDATABASE=shared node community/migrations/migrate.mjs apply
          PSQL_BINARY=/tmp/shared-psql PGUSER=postgres PGDATABASE=shared \
            node community/migrations/migrate.mjs apply --manifest community/migrations/index-db/manifest.json
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d shared -Atc \
            "SELECT (SELECT count(*) FROM public.schema_migrations) || ':' || (SELECT count(*) FROM public.index_schema_migrations)")" = "10:3"
          docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d shared \
            < community/scripts/index-db-functions.test.sql
      - name: Refuse an untracked index schema
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_ID}" createdb -U postgres untracked
          docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d untracked \
            < community/migrations/index-db/postgres/010-index-schema.sql
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d untracked "$@"\n' "${POSTGRES_ID}" > /tmp/untracked-psql
          chmod +x /tmp/untracked-psql
          if PSQL_BINARY=/tmp/untracked-psql PGUSER=postgres PGDATABASE=untracked \
            node community/migrations/migrate.mjs apply --manifest community/migrations/index-db/manifest.json; then
            echo "untracked index schema unexpectedly accepted" >&2
            exit 1
          fi
          PSQL_BINARY=/tmp/untracked-psql PGUSER=postgres PGDATABASE=untracked \
            node community/migrations/migrate.mjs baseline --confirm-existing \
              --baseline-through 010-index-schema --manifest community/migrations/index-db/manifest.json
          PSQL_BINARY=/tmp/untracked-psql PGUSER=postgres PGDATABASE=untracked \
            node community/migrations/migrate.mjs apply --manifest community/migrations/index-db/manifest.json
          test "$(docker exec "${POSTGRES_ID}" psql -U postgres -d untracked -Atc \
            "SELECT count(*) || ':' || count(*) FILTER (WHERE baselined) FROM public.index_schema_migrations")" = "3:1"
      - name: Validate index Compose overlay with the other overlays
        env:
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          INDEX_POSTGRES_PASSWORD: ci-index-password
          INDEX_POSTGRES_PASSWORD_URLENCODED: ci-index-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          BROWSER_SERVICE_API_KEY: ci-browser-key
          HIGHLIGHT_SERVICE_TOKEN: ci-highlight-token
        run: |
          files="-f docker-compose.yaml -f community/docker-compose.auth.yaml -f community/docker-compose.browser.yaml -f community/docker-compose.highlight.yaml -f community/docker-compose.index.yaml"
          docker compose ${files} config --quiet
          docker compose ${files} config --format json > /tmp/index-compose.json
          test "$(jq -r '.services.api.environment.INDEX_DATABASE_URL' /tmp/index-compose.json)" = "postgresql://postgres:ci-index-password@firecrawl-index-db:5432/firecrawl_index"
          test "$(jq -r '.services.api.environment.GCS_INDEX_BUCKET_NAME' /tmp/index-compose.json)" = "firecrawl-index"
          test "$(jq -r '.services.api.environment.STORAGE_EMULATOR_HOST' /tmp/index-compose.json)" = "http://firecrawl-index-storage:4443"
          test "$(jq -r '.services.api.environment.HIGHLIGHT_MODEL_URL' /tmp/index-compose.json)" = "http://highlight-service-community:3007"
          test "$(jq -r '.services.api.depends_on["firecrawl-index-db-migrate"].condition' /tmp/index-compose.json)" = "service_completed_successfully"
          test "$(jq -r '.services.api.depends_on["firecrawl-db-seed"].condition' /tmp/index-compose.json)" = "service_completed_successfully"
          test "$(jq -r '.services["firecrawl-index-storage"].ports // [] | length' /tmp/index-compose.json)" = 0
          test "$(jq -r '.services["firecrawl-index-storage-backend"].ports // [] | length' /tmp/index-compose.json)" = 0
          test "$(realpath "$(jq -r '.services["firecrawl-index-storage"].volumes[0].source' /tmp/index-compose.json)")" = "$(realpath community/index-storage)"
          resolved_context="$(jq -r '.services["firecrawl-index-db-migrate"].build.context' /tmp/index-compose.json)"
          test "$(realpath "${resolved_context}")" = "$(realpath community/migrations)"

  index-e2e:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.index == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build highlight service image
        run: docker build --tag firecrawl-highlight-service-community:ci apps/highlight-service-community
      - name: Scrape, maxAge, lockdown and search excerpts through the index overlay
        env:
          INDEX_E2E_PROJECT: fcindexci
          INDEX_E2E_HIGHLIGHT_COMPOSE: community/docker-compose.highlight.yaml
          HIGHLIGHT_IMAGE: firecrawl-highlight-service-community:ci
        run: node community/tests/index-e2e/run.mjs

  browser-service:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/browser-service-community
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/browser-service-community/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate browser Compose overlay
        env:
          BROWSER_SERVICE_API_KEY: ci-browser-key
        run: docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.browser.yaml config --quiet

  highlight-service:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.highlight == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/highlight-service-community
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/highlight-service-community/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate highlight Compose overlay
        env:
          HIGHLIGHT_SERVICE_TOKEN: ci-highlight-token
        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.highlight.yaml config --quiet
          resolved_context="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.highlight.yaml config --format json | jq -r '.services["highlight-service-community"].build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath .)"
          test "$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.highlight.yaml config --format json | jq -r '.services.api.environment.HIGHLIGHT_MODEL_URL')" = "http://highlight-service-community:3007"
      - name: Build highlight service image
        run: docker build --tag firecrawl-highlight-service-community:ci .
      - name: Run contract suite against the built image
        env:
          HIGHLIGHT_IMAGE: firecrawl-highlight-service-community:ci
        run: pnpm test:container

  privacy-service:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.privacy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fire-privacy-community
    env:
      SPACY_MODEL_URL: https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      SPACY_MODEL_SHA256: 1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/fire-privacy-community/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install service and pinned spaCy model
        run: |
          python -m pip install -r requirements-dev.txt
          curl --fail --silent --show-error --location --output /tmp/en_core_web_sm-3.8.0-py3-none-any.whl "${SPACY_MODEL_URL}"
          echo "${SPACY_MODEL_SHA256}  /tmp/en_core_web_sm-3.8.0-py3-none-any.whl" | sha256sum --check
          python -m pip install --no-deps /tmp/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Unit and in-process contract tests
        run: python -m pytest -q
      - name: Validate privacy Compose overlay
        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.privacy.yaml config --quiet
          resolved_context="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.privacy.yaml config --format json | jq -r '.services["fire-privacy-community"].build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath .)"
          test "$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.privacy.yaml config --format json | jq -r '.services.api.environment.FIRE_PRIVACY_URL')" = http://fire-privacy-community:3010
      - name: Build privacy image
        run: docker build --tag firecrawl-privacy-community-ci .
      - name: Black-box contract test against the built image
        run: |
          docker run --detach --name privacy-community-ci --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:39010:3010 \
            --env PRIVACY_API_KEY=ci-privacy-key \
            --env PRIVACY_DATA_REGION=us \
            firecrawl-privacy-community-ci
          trap 'docker logs privacy-community-ci || true; docker rm --force privacy-community-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:39010/health/readiness >/dev/null; then break; fi
            if [ "${attempt}" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          FIRE_PRIVACY_URL=http://127.0.0.1:39010 PRIVACY_API_KEY=ci-privacy-key node --test test/contract.mjs
          if docker logs privacy-community-ci 2>&1 | grep -q 'alice@example.com'; then
            echo "request text leaked into service logs" >&2
            exit 1
          fi


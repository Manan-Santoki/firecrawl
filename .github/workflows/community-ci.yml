        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/fire-engine-community/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Validate fire-engine Compose overlay
        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.fire-engine.yaml config --quiet
          resolved_context="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.fire-engine.yaml config --format json | jq -r '.services["fire-engine-community"].build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath .)"
          test "$(FIRE_ENGINE_API_KEY=ci-key docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.fire-engine.yaml config --format json | jq -r '.services.api.environment.FIRE_ENGINE_BETA_URL')" = "http://fire-engine-community:3010/key/ci-key"
      - name: Contract tests against the built image
        run: |
          docker build --tag fire-engine-community:ci .
          IMAGE=fire-engine-community:ci \
            BRANDING_ENTRY=../api/src/scraper/scrapeURL/engines/fire-engine/branding-script/index.ts \

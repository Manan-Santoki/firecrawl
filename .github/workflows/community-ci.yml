  agent-service:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-community
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/agent-community/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Unit and contract tests against a mock OpenAI-compatible server and a
      # mock Firecrawl API; the Redis suite uses the service container.
      - run: pnpm test
        env:
          AGENT_TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: pnpm build
      - name: Validate agent Compose overlay
        env:
          AGENT_INTEROP_SECRET: ci-agent-interop-secret-0123
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          BROWSER_SERVICE_API_KEY: ci-browser-key
        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.agent.yaml config --quiet
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.auth.yaml \
            -f ../../community/docker-compose.browser.yaml -f ../../community/docker-compose.agent.yaml config --quiet
          resolved="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.agent.yaml config --format json)"
          test "$(realpath "$(echo "${resolved}" | jq -r '.services["agent-community"].build.context')")" = "$(realpath .)"
          test "$(echo "${resolved}" | jq -r '.services.api.environment.EXTRACT_V3_BETA_URL')" = "http://agent-community:3010"
          # No startup cycle between the API and the agent service.
          test "$(echo "${resolved}" | jq -r '.services.api.depends_on["agent-community"] // "none"')" = "none"
          test "$(echo "${resolved}" | jq -r '.services["agent-community"].depends_on.api // "none"')" = "none"
      - name: Build image and smoke-test it with Redis
        run: |
          docker build --tag firecrawl-agent-community-ci .
          docker network create agent-smoke
          docker run --detach --name agent-smoke-redis --network agent-smoke redis:7-alpine
          trap 'docker rm --force agent-smoke-redis >/dev/null 2>&1 || true' EXIT
          SMOKE_DOCKER_NETWORK=agent-smoke pnpm exec tsx test/container-smoke.ts firecrawl-agent-community-ci redis://agent-smoke-redis:6379

  dashboard:
    needs: changes
    if: github.event_name == workflow_dispatch || needs.changes.outputs.dashboard == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard-community
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard-community/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply community migrations for the integration tests
        working-directory: .
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
        run: |
          printf '#!/bin/sh\nexec docker exec -i "%s" psql -U postgres -d dashboard "$@"\n' "${POSTGRES_ID}" > /tmp/dashboard-psql
          chmod +x /tmp/dashboard-psql
          PSQL_BINARY=/tmp/dashboard-psql PGUSER=postgres PGDATABASE=dashboard node community/migrations/migrate.mjs apply
          docker exec -i "${POSTGRES_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d dashboard \
            -v org_id=11111111-1111-4111-8111-111111111111 \
            -v team_id=22222222-2222-4222-8222-222222222222 \
            -v api_key=33333333-3333-4333-8333-333333333333 \
            < community/migrations/postgres/090-seed.sql
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests plus authorization/invite/key/limit tests against PostgreSQL.
      - run: pnpm test
        env:
          DASHBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dashboard
      - run: pnpm build
      - name: Build the dashboard image
        run: docker build --build-arg "GIT_SHA=${GITHUB_SHA}" --tag firecrawl-dashboard-community-ci .
      - name: Validate dashboard Compose overlay
        env:
          APP_POSTGRES_PASSWORD: ci-postgres-password
          APP_POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
          FIRECRAWL_ORG_ID: 11111111-1111-4111-8111-111111111111
          FIRECRAWL_TEAM_ID: 22222222-2222-4222-8222-222222222222
          FIRECRAWL_API_KEY_UUID: 33333333-3333-4333-8333-333333333333
          DASHBOARD_URL: https://dashboard.example.test
          BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
        run: |
          docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.auth.yaml \
            -f ../../community/docker-compose.dashboard.yaml config --quiet
          resolved_context="$(docker compose -f ../../docker-compose.yaml -f ../../community/docker-compose.auth.yaml -f ../../community/docker-compose.dashboard.yaml config --format json | jq -r '.services.dashboard.build.context')"
          test "$(realpath "${resolved_context}")" = "$(realpath .)"
